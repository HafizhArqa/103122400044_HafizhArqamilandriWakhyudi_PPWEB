</head>

                <button class="createbtn selectedbtn">CREATE</button>

            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <div class="nav-links">
                    <a href="./index.html" class="navlink"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Dashboard</a>
                    <a href="./registrasi.html" class="navlink"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg> Registrasi</a>

                </div>
            </div>

            <div class="landingpage">
                <div class="page-header">
                    <h1 class="page-title">Pengaturan Akun</h1>
                    <p class="page-desc">Perbarui informasi dasar profil Anda di sini.</p>
                </div>

                <div class="content-card" style="display: flex; gap: 40px; flex-wrap: wrap;">
                    <!-- Sisi Kiri: Upload Foto -->
                    <div style="flex: 1; min-width: 250px; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 40px;">
                        <img src="https://images.unsplash.com/photo-1535207010348-71e47296838a?auto=format&fit=crop&w=200&q=80" alt="Preview" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #9B51E0; margin-bottom: 20px;">
                        <div class="form-group">
                            <label>Unggah / Ubah Foto Profil</label>
                            <input type="file" name="image_01" accept="image/jpg, image/jpeg, image/png, image/webp" style="padding: 10px; border: 1px dashed rgba(255,255,255,0.3);">
                        </div>
                    </div>

                    <!-- Sisi Kanan: Form Data -->
                    <div style="flex: 2; min-width: 300px;">
                        <form action="editprofil.html" method="post" enctype="multipart/form-data">
                            <div class="form-group">
                                <label>Username Anda</label>
                                <input type="text" id="nama" name="nama" value="Laura" required>
                            </div>
                            <div class="form-group">
                                <label>Alamat Email</label>
                                <input type="email" name="email" id="email" value="laura.crypto@gaslur.com">
                            </div>
                            <div class="form-group">
                                <label>Program Pendidikan</label>
                                <select name="pendidikan" id="pendidikan">
                                    <option value="s1_bisnis">S1 Bisnis Digital</option>
                                    <option value="s1_rpl" selected>S1 Rekayasa Perangkat Lunak</option>
                                    <option value="s1_ti">S1 Teknik Informatika</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Bio / Alamat</label>
                                <textarea name="alamat" id="alamat" rows="3">Digital Artist and Crypto Enthusiast.</textarea>
                            </div>

                            <input type="submit" value="Simpan Perubahan">
                        </form>
                    </div>
                </div>

                <div class="footer2">
                    <p>Testing System Interface</p>
                    <p>Copyright 2021 Gaslur</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
