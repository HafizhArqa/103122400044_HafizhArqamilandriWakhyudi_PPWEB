        <div class="main-layout">
            <div class="sidebar">
                <div class="nav-links">
                    <a href="./index.html" class="navlink"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Dashboard</a>

                </div>
            </div>

            <div class="landingpage">
                <div class="page-header">
                    <h1 class="page-title">Pendaftaran Akun Baru</h1>
                    <p class="page-desc">Silahkan lengkapi data diri Anda secara valid pada formulir di bawah ini untuk tergabung dalam ekosistem GASLUR.</p>
                </div>

                <div class="content-card">
                    <form action="registrasi.html" method="post">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                            <div class="form-group">
                                <label>Nomor Induk Mahasiswa (NIM)</label>
                                <input type="number" id="nim" name="nim" placeholder="Contoh: 210101010" required>
                            </div>
                            <div class="form-group">
                                <label>Nama Lengkap</label>
                                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                            </div>
                            <div class="form-group">
                                <label>Usia</label>
                                <input type="number" id="usia" name="usia" placeholder="Tahun" required>
                            </div>
                            <div class="form-group">
                                <label>Pekerjaan</label>
                                <input type="text" id="pekerjaan" name="pekerjaan" placeholder="Contoh: Mahasiswa" required>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top: 10px;">
                            <label>Alamat Domisili</label>
                            <textarea name="alamat" id="alamat" rows="3" placeholder="Tuliskan alamat lengkap"></textarea>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                            <div class="form-group">
                                <label>Kewarganegaraan</label>
                                <select name="kewarganegaraan" id="kewarganegaraan">
                                    <option value="WNI">Warga Negara Indonesia (WNI)</option>
                                    <option value="WNA">Warga Negara Asing (WNA)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Program Pendidikan</label>
                                <select name="pendidikan" id="pendidikan">
                                    <option value="s1_bisnis">S1 Bisnis Digital</option>
                                    <option value="s1_rpl">S1 Rekayasa Perangkat Lunak</option>
                                    <option value="s1_ti">S1 Teknik Informatika</option>
                                </select>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 20px;">
                            <div class="form-group">
                                <label>Jenis Kelamin</label>
                                <div class="radio-group">
                                    <label><input type="radio" name="gender" value="male"> Laki-laki</label>
                                    <label><input type="radio" name="gender" value="female"> Perempuan</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Hobi & Minat</label>
                                <div class="radio-group" style="flex-wrap: wrap; gap: 15px;">
                                    <label><input type="checkbox" name="hobi" value="membaca"> Membaca</label>
                                    <label><input type="checkbox" name="hobi" value="menulis"> Menulis</label>
                                    <label><input type="checkbox" name="hobi" value="bermainmusik"> Musik</label>
                                    <label><input type="checkbox" name="hobi" value="olahraga"> Olahraga</label>
                                </div>
                            </div>
                        </div>

                        <input type="submit" value="Kirim Data Registrasi" style="width: 100%;">
                    </form>
                </div>

                <div class="footer2">
                    <p>Testing System Interface</p>
                    <p>Copyright 2021 Gaslur</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
